<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <!-- Ambient Background -->
  <div id="ambient-bg" class="ambient-bg ambient-clear ambient-day">
    <div class="particles" id="particles"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <h1 class="logo">Weather<span class="logo-accent">Dashboard</span></h1>
      <div class="header-controls">
        <button id="sound-toggle" class="icon-btn" aria-label="Toggle ambient sounds" title="Ambient sounds">
          <svg id="sound-icon-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          <svg id="sound-icon-on" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
        <button id="compare-toggle" class="icon-btn" aria-label="Compare two cities" title="Compare cities">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </button>
        <button id="share-btn" class="icon-btn" aria-label="Share weather card" title="Download weather card">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <div class="unit-toggle" role="group" aria-label="Temperature unit">
          <button id="btn-imperial" class="unit-btn active" aria-pressed="true">°F</button>
          <button id="btn-metric" class="unit-btn" aria-pressed="false">°C</button>
        </div>
      </div>
    </header>

    <!-- Search -->
    <section class="search-section">
      <div class="search-bar">
        <label for="search-input" class="sr-only">Search city</label>
        <input type="text" id="search-input" placeholder="Search any city... (press /)" aria-label="City search" autocomplete="off">
        <button id="search-btn" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <button id="geo-btn" aria-label="Use my location" title="Use my location">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          </svg>
        </button>
      </div>
      <div id="recent-searches" class="recent-searches"></div>
      <p class="keyboard-hint">Press <kbd>/</kbd> to search &middot; <kbd>Esc</kbd> to clear &middot; <kbd>C</kbd> to compare</p>
    </section>

    <!-- Error -->
    <div id="error-msg" class="error-msg" role="alert" aria-live="assertive"></div>

    <!-- Loading Skeleton -->
    <div id="loading" class="loading hidden">
      <div class="skeleton-grid">
        <div class="skeleton-card skeleton-lg"><div class="skeleton-pulse"></div></div>
        <div class="skeleton-card skeleton-lg"><div class="skeleton-pulse"></div></div>
        <div class="skeleton-card skeleton-sm"><div class="skeleton-pulse"></div></div>
        <div class="skeleton-card skeleton-sm"><div class="skeleton-pulse"></div></div>
        <div class="skeleton-card skeleton-sm"><div class="skeleton-pulse"></div></div>
        <div class="skeleton-card skeleton-sm"><div class="skeleton-pulse"></div></div>
      </div>
    </div>

    <!-- Weather Content -->
    <main id="weather-content" class="weather-content hidden">

      <!-- Weather Mood Narrative -->
      <p id="weather-mood" class="weather-mood"></p>

      <!-- Current Weather + Details -->
      <section class="current-weather reveal">
        <div class="current-main glass-card">
          <div class="current-header">
            <div>
              <h2 id="city-name" class="city-name"></h2>
              <p id="current-date" class="current-date"></p>
            </div>
            <img id="current-icon" class="current-icon" src="" alt="" loading="lazy">
          </div>
          <div class="temp-display">
            <span id="current-temp" class="current-temp"></span>
            <span id="temp-unit" class="temp-unit"></span>
          </div>
          <p id="current-desc" class="current-desc"></p>
          <p id="feels-like" class="feels-like"></p>
          <div class="high-low">
            <span id="temp-high" class="temp-high"></span>
            <span class="hl-divider">/</span>
            <span id="temp-low" class="temp-low"></span>
          </div>
        </div>

        <div class="current-details glass-card">
          <h3 class="details-title">Details</h3>
          <div class="detail-grid">
            <!-- Humidity Gauge -->
            <div class="detail-item gauge-item">
              <span class="detail-label">Humidity</span>
              <div class="gauge-wrap">
                <svg class="gauge-svg" viewBox="0 0 120 120">
                  <circle class="gauge-track" cx="60" cy="60" r="50" />
                  <circle id="humidity-arc" class="gauge-fill gauge-fill-blue" cx="60" cy="60" r="50" />
                  <text id="humidity-text" class="gauge-text" x="60" y="60" text-anchor="middle" dominant-baseline="central"></text>
                </svg>
              </div>
            </div>
            <!-- Wind Compass -->
            <div class="detail-item gauge-item">
              <span class="detail-label">Wind</span>
              <div class="compass-wrap">
                <svg class="compass-svg" viewBox="0 0 120 120">
                  <circle class="compass-ring" cx="60" cy="60" r="50"/>
                  <text class="compass-dir" x="60" y="18" text-anchor="middle">N</text>
                  <text class="compass-dir" x="102" y="64" text-anchor="middle">E</text>
                  <text class="compass-dir" x="60" y="110" text-anchor="middle">S</text>
                  <text class="compass-dir" x="18" y="64" text-anchor="middle">W</text>
                  <g id="wind-arrow" class="wind-arrow-group">
                    <polygon points="60,20 55,55 60,50 65,55" fill="rgba(248,113,113,0.9)"/>
                    <polygon points="60,100 55,65 60,70 65,65" fill="rgba(255,255,255,0.3)"/>
                  </g>
                  <text id="wind-speed-text" class="gauge-text" x="60" y="60" text-anchor="middle" dominant-baseline="central"></text>
                </svg>
              </div>
            </div>
            <!-- Pressure Gauge -->
            <div class="detail-item gauge-item">
              <span class="detail-label">Pressure</span>
              <div class="gauge-wrap">
                <svg class="gauge-svg" viewBox="0 0 120 120">
                  <circle class="gauge-track" cx="60" cy="60" r="50" />
                  <circle id="pressure-arc" class="gauge-fill gauge-fill-purple" cx="60" cy="60" r="50" />
                  <text id="pressure-text" class="gauge-text" x="60" y="55" text-anchor="middle" dominant-baseline="central"></text>
                  <text id="pressure-label" class="gauge-subtext" x="60" y="72" text-anchor="middle">hPa</text>
                </svg>
              </div>
            </div>
            <!-- Visibility -->
            <div class="detail-item gauge-item">
              <span class="detail-label">Visibility</span>
              <div class="gauge-wrap">
                <svg class="gauge-svg" viewBox="0 0 120 120">
                  <circle class="gauge-track" cx="60" cy="60" r="50" />
                  <circle id="visibility-arc" class="gauge-fill gauge-fill-teal" cx="60" cy="60" r="50" />
                  <text id="visibility-text" class="gauge-text" x="60" y="55" text-anchor="middle" dominant-baseline="central"></text>
                  <text id="visibility-label" class="gauge-subtext" x="60" y="72" text-anchor="middle"></text>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Sun Arc -->
      <section class="sun-arc-section glass-card reveal">
        <h3 class="section-title">Sun Position</h3>
        <div class="sun-arc-container">
          <svg id="sun-arc-svg" class="sun-arc-svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="arc-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#f97316"/>
                <stop offset="50%" stop-color="#fbbf24"/>
                <stop offset="100%" stop-color="#f97316"/>
              </linearGradient>
              <radialGradient id="sun-glow">
                <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <!-- Horizon line -->
            <line x1="30" y1="180" x2="370" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- Arc path -->
            <path id="sun-path" d="M 30 180 Q 200 -20 370 180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6,4"/>
            <!-- Traversed arc -->
            <path id="sun-path-active" d="" fill="none" stroke="url(#arc-gradient)" stroke-width="3" stroke-linecap="round"/>
            <!-- Sun glow -->
            <circle id="sun-glow-circle" cx="0" cy="0" r="20" fill="url(#sun-glow)" class="hidden"/>
            <!-- Sun dot -->
            <circle id="sun-dot" cx="0" cy="0" r="7" fill="#fbbf24" class="hidden"/>
            <!-- Labels -->
            <text id="sunrise-label" x="30" y="198" text-anchor="middle" class="sun-label"></text>
            <text id="sunset-label" x="370" y="198" text-anchor="middle" class="sun-label"></text>
            <text id="sun-time-label" x="200" y="12" text-anchor="middle" class="sun-time-text"></text>
          </svg>
        </div>
      </section>

      <!-- Hourly Forecast Chart -->
      <section class="hourly-section glass-card reveal">
        <h3 class="section-title">Hourly Forecast</h3>
        <div class="hourly-chart-container">
          <svg id="hourly-chart" class="hourly-chart" viewBox="0 0 800 250" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="chart-gradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
              </linearGradient>
            </defs>
          </svg>
          <div id="chart-tooltip" class="chart-tooltip hidden"></div>
        </div>
      </section>

      <!-- 4-Day Forecast -->
      <section class="forecast-section reveal">
        <h3 class="section-title">4-Day Forecast</h3>
        <div id="forecast-cards" class="forecast-cards"></div>
      </section>

      <!-- Info Row: Outfit + AQI -->
      <section class="info-row reveal">
        <div id="outfit-section" class="outfit-section glass-card">
          <div class="outfit-icon-wrap">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/>
            </svg>
          </div>
          <div>
            <h3 class="outfit-title">What to Wear</h3>
            <p id="outfit-advice" class="outfit-advice"></p>
          </div>
        </div>

        <div id="aqi-section" class="aqi-section glass-card">
          <h3 class="aqi-title">Air Quality</h3>
          <div class="aqi-display">
            <div class="aqi-gauge-wrap">
              <svg class="aqi-gauge-svg" viewBox="0 0 120 70">
                <path class="aqi-track" d="M 10 65 A 50 50 0 0 1 110 65" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" stroke-linecap="round"/>
                <path id="aqi-fill" class="aqi-arc" d="M 10 65 A 50 50 0 0 1 110 65" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
                <text id="aqi-value" x="60" y="55" text-anchor="middle" class="aqi-value-text">--</text>
              </svg>
            </div>
            <p id="aqi-label" class="aqi-label">--</p>
            <p id="aqi-desc" class="aqi-desc"></p>
          </div>
        </div>
      </section>

      <!-- Weather Map -->
      <section class="map-section glass-card reveal">
        <div class="map-header">
          <h3 class="section-title">Weather Map</h3>
          <div class="map-layer-toggle" role="group" aria-label="Map layer">
            <button class="map-layer-btn active" data-layer="precipitation_new">Rain</button>
            <button class="map-layer-btn" data-layer="clouds_new">Clouds</button>
            <button class="map-layer-btn" data-layer="temp_new">Temp</button>
            <button class="map-layer-btn" data-layer="wind_new">Wind</button>
          </div>
        </div>
        <div id="weather-map" class="weather-map"></div>
      </section>
    </main>

    <!-- Comparison Mode -->
    <div id="compare-panel" class="compare-panel hidden">
      <div class="compare-header">
        <h2 class="compare-title">City Comparison</h2>
        <button id="compare-close" class="icon-btn" aria-label="Close comparison">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="compare-searches">
        <div class="compare-search-group">
          <input type="text" id="compare-input-1" class="compare-input" placeholder="City 1..." aria-label="First city">
        </div>
        <span class="compare-vs">VS</span>
        <div class="compare-search-group">
          <input type="text" id="compare-input-2" class="compare-input" placeholder="City 2..." aria-label="Second city">
        </div>
        <button id="compare-go" class="compare-go-btn">Compare</button>
      </div>
      <div id="compare-results" class="compare-results"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>Powered by <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeatherMap</a></p>
    </footer>
  </div>

  <!-- Hidden canvas for share -->
  <canvas id="share-canvas" width="600" height="400" style="display:none;"></canvas>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
